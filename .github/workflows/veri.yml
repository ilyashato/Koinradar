name: Veri ve geri test
# Elle çalıştırılır (Actions → "Veri ve geri test" → Run workflow).
# Binance ABD IP'lerini engelleyebilir; hata alırsanız komutu kendi bilgisayarınızda çalıştırıp data/ klasörünü yükleyin.
on:
  workflow_dispatch:
    inputs:
      top:
        description: 'Taranacak parite sayısı (0 = tümü)'
        default: '0'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tara, dışa aktar, geri test
        run: |
          cd data
          cp ../engine.js ../radar.mjs .
          node radar.mjs --top ${{ github.event.inputs.top || '0' }} --export --backtest
          rm engine.js radar.mjs
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Veri güncellendi: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "değişiklik yok"
          git push
